# Explicitly synthetic, single-node enterprise story profile.
#
# This profile is for demonstrations and evaluation only. It seeds the bundled
# fictional Northstar Health AI estate. Sign in with the AGENT_BOM_API_KEYS key
# from the agent-bom-control-plane Secret; a `:viewer` key suits a read-only
# demonstration. It must not be used for production or combined with live
# customer collection.
#
# Install:
#   python scripts/install_helm_profile.py synthetic-enterprise-story

controlPlane:
  enabled: true
  migrations:
    postgres:
      enabled: false
  api:
    replicas: 1
    envFrom:
      - secretRef:
          name: agent-bom-control-plane
    env:
      - name: AGENT_BOM_DB
        value: /var/lib/agent-bom/control-plane.sqlite
      - name: AGENT_BOM_DEMO_ESTATE
        value: "1"
      # The API refuses a non-loopback bind without authentication, so this
      # profile takes its sign-in key from the Secret below. A missing key stops
      # the pod (CreateContainerConfigError); it never starts anonymous.
      - name: AGENT_BOM_API_KEYS
        valueFrom:
          secretKeyRef:
            name: agent-bom-control-plane
            key: AGENT_BOM_API_KEYS
    extraVolumes:
      - name: sqlite-data
        persistentVolumeClaim:
          claimName: agent-bom-synthetic-enterprise-story
    extraVolumeMounts:
      - name: sqlite-data
        mountPath: /var/lib/agent-bom
  ui:
    replicas: 1
    env:
      - name: NEXT_PUBLIC_API_URL
        value: ""
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: agent-bom-demo.internal.example.com
        apiPaths:
          - path: /v1
            pathType: Prefix
          - path: /health
            pathType: Prefix
          - path: /docs
            pathType: Prefix
        uiPaths:
          - path: /
            pathType: Prefix

scanner:
  enabled: false

pdb:
  enabled: false
