{{- $np := .Values.controlPlane.networkPolicy | default dict }}
{{- if and .Values.controlPlane.enabled (ne $np.enabled false) }}
{{- range $component := list "api" "ui" }}
{{- $workload := index $.Values.controlPlane $component }}
{{- if $workload.enabled }}
{{- $serviceType := ($workload.service | default dict).type | default "ClusterIP" }}
{{- if and (has $serviceType (list "NodePort" "LoadBalancer")) (not $np.ingressCIDRs) (not $np.additionalIngress) }}
{{- fail (printf "controlPlane.%s.service.type=%s receives traffic from outside the cluster, which the control-plane NetworkPolicy drops. Set controlPlane.networkPolicy.ingressCIDRs to the client, load balancer or node ranges (node CIDRs when externalTrafficPolicy is Cluster), add a rule to controlPlane.networkPolicy.additionalIngress, or set controlPlane.networkPolicy.enabled=false" $component $serviceType) }}
{{- end }}
---
# Ingress-only: the API and UI accept traffic from their own namespace and the
# ingress controller, never from every namespace. Egress stays open so
# Postgres, identity providers and cloud APIs keep working.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-bom.name" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agent-bom.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agent-bom.name" $ }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range ($np.ingressNamespaces | default (list "ingress-nginx")) }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
    {{- with $np.ingressCIDRs }}
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ $workload.port }}
          protocol: TCP
    {{- end }}
    {{- with $np.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
{{- if (index $.Values.controlPlane "worker" | default dict).enabled }}
---
# The worker serves no traffic: its HTTP port exists for kubelet probes only,
# and Kubernetes always admits traffic from the pod's own node. Deny all other
# ingress unless the operator adds rules (e.g. a metrics scraper). Egress stays
# open for Postgres and the scan targets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-bom.name" $ }}-worker
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agent-bom.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agent-bom.name" $ }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
  {{- with $np.workerAdditionalIngress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
