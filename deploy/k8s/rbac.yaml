apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-bom
  namespace: agent-bom
  labels:
    app.kubernetes.io/name: agent-bom
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-bom-reader
  labels:
    app.kubernetes.io/name: agent-bom
rules:
  # Read-only workload inventory, posture and admission reads. No secrets, no mutation verbs.
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "serviceaccounts"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings", "validatingwebhookconfigurations"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-bom-reader
  labels:
    app.kubernetes.io/name: agent-bom
subjects:
  - kind: ServiceAccount
    name: agent-bom
    namespace: agent-bom
roleRef:
  kind: ClusterRole
  name: agent-bom-reader
  apiGroup: rbac.authorization.k8s.io
