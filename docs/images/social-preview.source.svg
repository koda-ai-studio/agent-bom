<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">agent-bom: AI supply-chain BOM — every agent, MCP server and AI package, and what each one can reach.</title>
  <desc id="desc">AI supply-chain BOM: every agent, MCP server and AI package, and what each one can reach. Agents, MCP servers, tools, packages, credentials and data, with evidence for every edge.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b17"/>
      <stop offset="100%" stop-color="#0a1325"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <g font-family="Inter,'Segoe UI',ui-sans-serif,Arial,sans-serif">
    <g transform="translate(40 24)">
      <image href="brand/mark-dark.svg" width="48" height="48"/>
      <text x="64" y="38" font-size="40" font-weight="800" letter-spacing="-0.8" fill="#f8fafc">agent<tspan fill="url(#brand)">·bom</tspan></text>
    </g>

    <text x="40" y="134" font-size="52" font-weight="820" letter-spacing="-2.1" fill="#f8fafc">AI supply-chain </text>
    <text x="440" y="134" font-size="52" font-weight="820" letter-spacing="-2.1" fill="url(#brand)">BOM</text>
    <text x="40" y="172" fill="#94a3b8" font-size="18" font-weight="500">Every agent, MCP server and AI package, and what each one can reach.</text>

    <text x="40" y="210" fill="#94a3b8" font-size="14" font-weight="500">Agents → MCP servers → tools → packages → credentials → data, with evidence for every edge.</text>

    <g id="coverage"/>

    <text x="40" y="622" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600">agent → MCP server → packages → CVEs → blast radius</text>
    <text x="1240" y="622" text-anchor="end" fill="#94a3b8" font-size="10" font-weight="600">CLI · CI · API · MCP · self-hosted</text>
  </g>
</svg>
