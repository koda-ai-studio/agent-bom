<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">agent-bom: Discover. Scan. Correlate. Act.</title>
  <desc id="desc">Security evidence across repositories, software supply chains, AI agents, MCP, models, cloud, identity, infrastructure, and data platforms.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b17"/>
      <stop offset="100%" stop-color="#0a1325"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <g font-family="Inter,'Segoe UI',ui-sans-serif,Arial,sans-serif">
    <g transform="translate(60 28)">
      <image href="brand/mark-dark.svg" width="64" height="64"/>
      <text x="82" y="49" font-size="52" font-weight="800" letter-spacing="-0.8" fill="#f8fafc">agent<tspan fill="url(#brand)">·bom</tspan></text>
    </g>

    <text x="60" y="184" font-size="64" font-weight="820" letter-spacing="-2.1" fill="#f8fafc">Discover. Scan.</text>
    <text x="550" y="184" font-size="64" font-weight="820" letter-spacing="-2.1" fill="url(#brand)">Correlate. Act.</text>
    <text x="60" y="230" fill="#94a3b8" font-size="21" font-weight="500">Security evidence across repositories, supply chains, AI + MCP, cloud, identity, and data.</text>

    <g transform="translate(60 254)">
      <g>
        <rect width="172" height="38" rx="19" fill="#0f172a" stroke="#3b82f6"/>
        <text x="86" y="25" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">repos + SCA</text>
      </g>
      <g transform="translate(184)">
        <rect width="188" height="38" rx="19" fill="#0f172a" stroke="#22d3ee"/>
        <text x="94" y="25" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">images + IaC</text>
      </g>
      <g transform="translate(384)">
        <rect width="168" height="38" rx="19" fill="#0f172a" stroke="#86efac"/>
        <text x="84" y="25" text-anchor="middle" fill="#86efac" font-size="14" font-weight="700">AI + MCP + models</text>
      </g>
      <g transform="translate(564)">
        <rect width="206" height="38" rx="19" fill="#0f172a" stroke="#c4b5fd"/>
        <text x="103" y="25" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">cloud + identity + data</text>
      </g>
    </g>

    <g id="coverage"/>

    <text x="60" y="622" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600">discover → scan → correlate → act</text>
    <text x="1220" y="622" text-anchor="end" fill="#475569" font-size="13" font-weight="600">CLI · CI · API · MCP · self-hosted</text>
  </g>
</svg>
