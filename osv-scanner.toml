# ── filelock — fix needs snowflake-connector-python 5.x (no musl wheels) ─────
# snowflake-connector-python 4.7.3 requires filelock<4. 5.x drops filelock but
# ships no musllinux wheels and needs a Rust toolchain to build on the Alpine
# image. No locked dependency uses filelock.ReadWriteLock (GHSA-v4x8, GHSA-9vhv).
# GHSA-567q is Windows-only and reaches SoftFileLock, which huggingface_hub
# (huggingface extra) falls back to only on filesystems without flock.
# Tracked in https://github.com/koda-ai-studio/agent-bom/issues/5934

[[IgnoredVulns]]
id = "GHSA-v4x8-3wr5-3wq8"
