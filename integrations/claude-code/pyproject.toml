# Launcher for this plugin's two MCP servers, not a package. .mcp.json runs
# `uv run --frozen --isolated --project <plugin root> agent-bom mcp server`, so uv
# installs exactly what uv.lock records (versions, PyPI URLs, sha256 hashes) and
# never resolves at launch. Regenerated by scripts/bump-version.py --published.
[project]
name = "agent-bom-plugin-launcher"
version = "0.0.0"
description = "Pins the agent-bom release the plugin's MCP servers run."
requires-python = ">=3.11,<3.15"
dependencies = ["agent-bom==0.110.0"]

[tool.uv]
package = false
# Wheels for other platforms are left out of the lock to keep it under the
# plugin directory's 256 KiB per-file limit.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64')",
]
