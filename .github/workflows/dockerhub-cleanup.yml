name: Docker Hub Tag Cleanup

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      keep_count:
        description: "Number of recent semantic-version tags to keep per repository"
        required: false
        default: "10"
      dry_run:
        description: "Dry run — list tags to delete without deleting"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      expected_delete_count:
        description: "Optional fail-closed assertion for the total number of deletions"
        required: false
        default: ""

concurrency:
  group: dockerhub-tag-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Clean up old Docker Hub tags across release images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: docker-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm and chart metadata reader
        run: |
          set -euo pipefail
          HELM_VERSION="3.18.6"
          HELM_SHA256="3f43c0aa57243852dd542493a0f54f1396c0bc8ec7296bbb2c01e802010819ce"
          HELM_ARCHIVE="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${HELM_ARCHIVE}" "https://get.helm.sh/${HELM_ARCHIVE}"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/${HELM_ARCHIVE}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${HELM_ARCHIVE}" -C "$RUNNER_TEMP"
          sudo mv "${RUNNER_TEMP}/linux-amd64/helm" /usr/local/bin/helm
          python3 -m pip install --upgrade 'pip>=26.2.2'
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'

      - name: Preserve references from every published chart
        run: |
          set -euo pipefail
          python3 scripts/helm_image_retention.py \
            --repository koda-ai-studio/charts/agent-bom \
            --output "${RUNNER_TEMP}/helm-image-retention.json"

      - name: Plan and apply bounded retention
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KEEP_COUNT: ${{ inputs.keep_count || '10' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          EXPECTED_DELETE_COUNT: ${{ inputs.expected_delete_count || '' }}
        run: |
          set -euo pipefail
          # Never let retention delete the version this repository currently
          # ships, whatever its rank among the published tags.
          CURRENT_VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::could not read the current version from pyproject.toml"
            exit 1
          fi
          args=(
            --repository agentbom/agent-bom
            --repository agentbom/agent-bom-ui
            --repository agentbom/agent-bom-collector
            --keep-count "$KEEP_COUNT"
            --protect-tag "$CURRENT_VERSION"
            --protected-images-file "${RUNNER_TEMP}/helm-image-retention.json"
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$EXPECTED_DELETE_COUNT" ]; then
            args+=(--expected-delete-count "$EXPECTED_DELETE_COUNT")
          fi
          python3 scripts/dockerhub_tag_cleanup.py "${args[@]}"

      - name: Retain published chart reference receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-image-retention
          path: ${{ runner.temp }}/helm-image-retention.json
          if-no-files-found: warn
