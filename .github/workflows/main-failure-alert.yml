name: Main Failure Alert

on:
  workflow_run:
    workflows:
      - "CI/CD Pipeline"
      - "Release"
      - "Publish to Registries"
      - "Publish to MCP Registry"
      - "Publish MCP Container"
      - "Deploy MCP SSE"
      # Post-merge lanes that left PR CI; a main regression must still page.
      - "Runtime Helm Acceptance"
      - "ClusterFuzzLite"
    types: [completed]

concurrency:
  group: main-failure-alert-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  # A tracker that can only ever open is not a tracker — it is a permanent
  # accusation. #4712 sat open as a `release-blocker` for days after its cause
  # (a stale PRODUCT_METRICS snapshot) had been fixed, because nothing here ever
  # closed it. Since the release gate is "no tag while a release-blocker is
  # open", an issue that cannot self-close can never be satisfied and has to be
  # closed by hand — which is exactly how a real regression gets closed by
  # reflex. The supply-chain drift trackers already self-close on green; this
  # makes the CI tracker behave the same way.
  resolve:
    # A cancelled run is not evidence either way, but it can be the newest run
    # on main; reconciling on it keeps a green predecessor from being stranded.
    if: ${{ contains(fromJSON('["success","cancelled"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - name: Close the regression issue once main is green again
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const workflow = context.payload.workflow_run.name;
            const title = `ci-regression: ${workflow} failing on main`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // The exact-head full pipeline is the release proof, so one green run
            // at the current main head is sufficient recovery evidence.
            const RECOVERY_STREAK = 1;
            const FAILURE_STREAK = workflow === "CI/CD Pipeline" || workflow === "Release" ? 3 : 5;

            // Completion events can arrive after a newer run has started or finished.
            const run = context.payload.workflow_run;
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: run.workflow_id, branch: "main", event: "push", per_page: 20,
            });
            const latest = data.workflow_runs[0];
            if (!latest || latest.id !== run.id || latest.run_attempt !== run.run_attempt) return;

            // Only green and red runs are evidence; cancelled, skipped and neutral are not.
            const failed = new Set(["failure", "timed_out", "startup_failure"]);
            const decisive = data.workflow_runs
              .map((past) => (past.id === run.id ? {...past, ...run, status: "completed"} : past))
              .filter((past) => past.status === "completed" && (past.conclusion === "success" || failed.has(past.conclusion)));
            let greens = 0;
            for (const past of decisive) {
              if (past.conclusion !== "success") break;
              greens += 1;
            }
            if (greens < RECOVERY_STREAK) return;
            const green = decisive[0];
            // CI recovery must describe the current branch, not an older green SHA.
            if (workflow === "CI/CD Pipeline") {
              const {data: branch} = await github.rest.repos.getBranch({owner, repo, branch: "main"});
              if (branch.commit.sha !== green.head_sha) return;
            }

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "ci-regression",
              per_page: 100,
            });
            const match = existing.find((issue) => issue.title === title && issue.state === "open" && !issue.pull_request);
            if (!match) {
              return;
            }
            // The body keeps the failure evidence; the comment records the recovery.
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: match.number,
              body: [
                `**${workflow}** is green on \`main\` again: ${greens} consecutive green run${greens === 1 ? "" : "s"}.`,
                "",
                `- SHA: \`${(green.head_sha || "").slice(0, 7)}\``,
                `- Run: ${green.html_url}`,
                "",
                `Closed automatically. Reopens after ${FAILURE_STREAK} consecutive failed runs on main; cancelled runs are ignored.`,
              ].join("\n"),
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: match.number,
              state: "closed",
              state_reason: "completed",
            });

  alert:
    if: ${{ contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - name: Open or update regression issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const workflow = context.payload.workflow_run.name;
            const htmlUrl = context.payload.workflow_run.html_url;
            const sha = context.payload.workflow_run.head_sha.slice(0, 7);
            const title = `ci-regression: ${workflow} failing on main`;
            const labels = ["ci-regression", "release-blocker"];
            // Scheduled publish/deploy runs retry every few hours while an external
            // registry catches up, so they need a longer streak than CI to mean "broken".
            const FAILURE_STREAK = workflow === "CI/CD Pipeline" || workflow === "Release" ? 3 : 5;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = [
              `Workflow **${workflow}** failed on \`main\`.`,
              "",
              `- SHA: \`${sha}\``,
              `- Run: ${htmlUrl}`,
              `- Actor: @${context.payload.workflow_run.actor.login}`,
              `- Latest runs: ${context.serverUrl}/${owner}/${repo}/actions/workflows/${context.payload.workflow_run.workflow_id}`,
              "",
              `Opened automatically after ${FAILURE_STREAK} consecutive failed runs on main (cancelled runs ignored); closes with a comment on the next green run at the main head.`,
            ].join("\n");

            // Completion events can arrive after a newer run has started or finished.
            const run = context.payload.workflow_run;
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: run.workflow_id, branch: "main", event: "push", per_page: 20,
            });
            const latest = data.workflow_runs[0];
            if (!latest || latest.id !== run.id || latest.run_attempt !== run.run_attempt) return;
            // One red run is a flake, a fix already in flight, or a provider that has
            // not synced yet. Only a workflow that keeps failing on main is an incident.
            const failed = new Set(["failure", "timed_out", "startup_failure"]);
            let streak = 0;
            for (const past of data.workflow_runs) {
              if (past.id === run.id) {
                streak += 1;
                continue;
              }
              if (past.status !== "completed" || !past.conclusion) continue;
              if (failed.has(past.conclusion)) streak += 1;
              else if (past.conclusion === "success") break;
              if (streak >= FAILURE_STREAK) break;
            }
            if (streak < FAILURE_STREAK) return;
            // CI recovery must describe the current branch, not an older green SHA.
            if (workflow === "CI/CD Pipeline") {
              const {data: branch} = await github.rest.repos.getBranch({owner, repo, branch: "main"});
              if (branch.commit.sha !== run.head_sha) return;
            }

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              sort: "created",
              direction: "desc",
              labels: "ci-regression",
              per_page: 100,
            });
            const candidates = existing.filter((issue) => issue.title === title && !issue.pull_request);
            const match = candidates.find((issue) => issue.state === "open") || candidates[0];
            if (match) {
              // Run URLs and actors change on retries without changing the incident.
              const evidence = value => (value || "").replace(/^- (Run:|Actor:) .*$/gm, "");
              if (match.state === "open" && evidence(match.body) === evidence(body)) return;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: match.number,
                state: "open",
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels,
            });
