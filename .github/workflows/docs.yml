name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'site-docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # The read-only demo at /demo/ is the UI export plus product-proof fixtures.
      - 'ui/**'
      - 'examples/reference-evidence-lab/generated/**'
      - '.github/actions/setup-ui/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        description: 'Deploy built docs to GitHub Pages'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.11'

      - name: Build site
        run: >-
          uv tool run
          --from mkdocs==1.6.1
          --with mkdocs-material==9.7.5
          --with mkdocstrings==1.0.3
          --with mkdocstrings-python==2.0.3
          --with pymdown-extensions==11.0.2
          mkdocs build --strict

      - name: Set up UI toolchain
        uses: ./.github/actions/setup-ui

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # Read-only demo: a static export that reads shipped sample JSON and
      # never calls an API. Served at /agent-bom/demo/ next to the docs.
      - name: Build read-only demo export
        working-directory: ui
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_STATIC_DEMO: '1'
          NEXT_PUBLIC_BASE_PATH: /agent-bom/demo
        run: npm run build

      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install chromium

      - name: Record demo sample data from product-proof fixtures
        working-directory: ui
        run: node scripts/generate-static-demo-data.mjs --out out --base-path /agent-bom/demo

      - name: Fail on real-looking data in the demo bundle
        working-directory: ui
        run: node scripts/static-demo-leak-scan.mjs out

      - name: Click through the demo with no API behind it
        working-directory: ui
        run: node scripts/verify-static-demo.mjs --out out --base-path /agent-bom/demo

      - name: Place demo under the docs site
        run: |
          rm -rf site/demo
          mv ui/out site/demo
          # Next requests the base route's RSC payload as /agent-bom/demo.txt.
          cp site/demo/index.txt site/demo.txt
          du -sh site/demo

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_call' || inputs.deploy == true) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialize only real Pages deployments. Keeping this at job level (not the
    # whole workflow) means build-only validation runs — e.g. the release
    # workflow calling this with deploy:false — never join the pages group and
    # so can't cancel an in-progress deploy. cancel-in-progress:false lets a
    # running production deploy finish instead of being cancelled mid-flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
