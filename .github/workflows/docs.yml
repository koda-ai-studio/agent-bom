name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'site-docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-build.yml'
      # The read-only demo at /demo/ is the UI export plus product-proof fixtures.
      - 'ui/**'
      - 'examples/reference-evidence-lab/generated/**'
      - '.github/actions/setup-ui/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The build steps live in docs-build.yml so the release run can call the
    # build alone, without a skipped deploy job in its summary.
    permissions:
      contents: read
    uses: ./.github/workflows/docs-build.yml

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialize only real Pages deployments. Keeping this at job level (not the
    # whole workflow) means the build never joins the pages group and so can't
    # cancel an in-progress deploy. cancel-in-progress:false lets a running
    # production deploy finish instead of being cancelled mid-flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
