name: Qualification

# Measures real-world accuracy, performance and platform behaviour on hosted
# runners. Manual only, plus pull requests that change this workflow or its
# scripts, so PR CI keeps its time budget. See docs/operations/CI_RUNBOOK.md.
on:
  workflow_dispatch:
    inputs:
      lanes:
        description: 'Comma-separated lanes with no spaces, or all: accuracy,performance,platforms,action,identity,runtime,deploy'
        required: false
        default: all
        type: string
  pull_request:
    paths:
      - .github/workflows/qualification.yml
      - scripts/qualification/**
  push:
    branches:
      - ci/qualification-workflow

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'
  AGENT_BOM_SKIP_UPDATE_CHECK: '1'

jobs:
  accuracy:
    name: Accuracy (${{ matrix.target }})
    if: ${{ (github.event_name == 'pull_request') || inputs.lanes == 'all' || contains(format(',{0},', inputs.lanes), ',accuracy,') || (github.event_name == 'push' && (!contains(github.event.head_commit.message, 'lanes=') || contains(github.event.head_commit.message, 'accuracy'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [langchain-v0.0.300, juice-shop-v15.0.0, nginx-1.21.6, redis-7.0.11]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install from source
        shell: bash
        run: uv sync --frozen --no-dev
      - name: Scan the pinned target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: uv run --no-sync python scripts/qualification/accuracy.py --target "$TARGET"
      - name: Summarize
        if: always()
        shell: bash
        run: uv run --no-sync python scripts/qualification/summarize.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-accuracy-${{ matrix.target }}
          path: qualification-results/
          retention-days: 30

  performance:
    name: Performance (SQLite)
    if: ${{ (github.event_name == 'pull_request') || inputs.lanes == 'all' || contains(format(',{0},', inputs.lanes), ',performance,') || (github.event_name == 'push' && (!contains(github.event.head_commit.message, 'lanes=') || contains(github.event.head_commit.message, 'performance'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install from source
        shell: bash
        run: uv sync --frozen --no-dev --extra api
      - name: Measure on SQLite
        shell: bash
        run: uv run --no-sync python scripts/qualification/performance.py --backend sqlite
      - name: Summarize
        if: always()
        shell: bash
        run: uv run --no-sync python scripts/qualification/summarize.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-performance-sqlite
          path: qualification-results/
          retention-days: 30

  performance-postgres:
    name: Performance (Postgres)
    if: ${{ (github.event_name == 'pull_request') || inputs.lanes == 'all' || contains(format(',{0},', inputs.lanes), ',performance,') || (github.event_name == 'push' && (!contains(github.event.head_commit.message, 'lanes=') || contains(github.event.head_commit.message, 'performance'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: qualification-synthetic
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUALIFICATION_POSTGRES_ADMIN_URL: postgresql://postgres:qualification-synthetic@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install from source
        shell: bash
        run: uv sync --frozen --no-dev --extra api --extra postgres
      - name: Measure on Postgres
        shell: bash
        run: uv run --no-sync python scripts/qualification/performance.py --backend postgres
      - name: Summarize
        if: always()
        shell: bash
        run: uv run --no-sync python scripts/qualification/summarize.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-performance-postgres
          path: qualification-results/
          retention-days: 30

  platforms:
    name: Platforms (${{ matrix.os }})
    if: ${{ (github.event_name == 'pull_request') || inputs.lanes == 'all' || contains(format(',{0},', inputs.lanes), ',platforms,') || (github.event_name == 'push' && (!contains(github.event.head_commit.message, 'lanes=') || contains(github.event.head_commit.message, 'platforms'))) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install from source into a clean environment
        shell: bash
        run: |
          set -euo pipefail
          began="$(date +%s)"
          uv venv "$RUNNER_TEMP/qualification-venv" --python 3.11
          if [ "$RUNNER_OS" = "Windows" ]; then
            venv_python="$RUNNER_TEMP/qualification-venv/Scripts/python.exe"
          else
            venv_python="$RUNNER_TEMP/qualification-venv/bin/python"
          fi
          uv pip install --python "$venv_python" .
          echo "VENV_PYTHON=$venv_python" >> "$GITHUB_ENV"
          echo "INSTALL_SECONDS=$(( $(date +%s) - began ))" >> "$GITHUB_ENV"
      - name: Walk the first run
        shell: bash
        env:
          PLATFORM_VARIANT: ${{ matrix.os }}
        run: '"$VENV_PYTHON" scripts/qualification/platforms.py --variant "$PLATFORM_VARIANT" --install-seconds "$INSTALL_SECONDS"'
      - name: Summarize
        if: always()
        shell: bash
        run: '"$VENV_PYTHON" scripts/qualification/summarize.py'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-platforms-${{ matrix.os }}
          path: qualification-results/
          retention-days: 30

  action:
    name: Action (${{ matrix.case }})
    if: ${{ (github.event_name == 'pull_request') || inputs.lanes == 'all' || contains(format(',{0},', inputs.lanes), ',action,') || (github.event_name == 'push' && (!contains(github.event.head_commit.message, 'lanes=') || contains(github.event.head_commit.message, 'action'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: [docs-only, with-packages]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the fixture
        shell: bash
        env:
          QUALIFICATION_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p .qualification-fixture/docs
          printf '# Project\n\nDocumentation only.\n' > .qualification-fixture/docs/README.md
          if [ "$QUALIFICATION_CASE" = "with-packages" ]; then
            printf 'requests==2.19.0\n' > .qualification-fixture/requirements.txt
          fi
      - name: Run the action as a user would
        id: action
        continue-on-error: true
        uses: ./
        with:
          scan-ref: .qualification-fixture
          install-from-source: 'true'
          pr-comment: 'false'
      - uses: ./.github/actions/setup-python
      - name: Assert the outputs and the SARIF
        shell: bash
        env:
          QUALIFICATION_CASE: ${{ matrix.case }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          SCAN_STATUS: ${{ steps.action.outputs.scan-status }}
          VULNERABILITY_COUNT: ${{ steps.action.outputs.vulnerability-count }}
          SARIF_FILE: ${{ steps.action.outputs.sarif-file }}
        run: >-
          uv run --no-project --with jsonschema==4.26.0 python scripts/qualification/action_check.py
          --case "$QUALIFICATION_CASE" --sarif "${SARIF_FILE:-agent-bom-results.sarif}"
          --exit-code "$EXIT_CODE" --status "$SCAN_STATUS" --vulnerability-count "$VULNERABILITY_COUNT"
      - name: Summarize
        if: always()
        shell: bash
        run: uv run --no-project python scripts/qualification/summarize.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-action-${{ matrix.case }}
          path: |
            qualification-results/
            agent-bom-results.sarif
          retention-days: 30

  identity:
    name: Identity (Keycloak)
    if: ${{ (github.event_name == 'pull_request') || inputs.lanes == 'all' || contains(format(',{0},', inputs.lanes), ',identity,') || (github.event_name == 'push' && (!contains(github.event.head_commit.message, 'lanes=') || contains(github.event.head_commit.message, 'identity'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install from source with identity extras
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxml2-dev libxmlsec1-dev pkg-config
          uv sync --frozen --no-dev --extra api --extra oidc --extra saml
      - name: Run the identity lane
        shell: bash
        run: uv run --no-sync python scripts/qualification/identity.py
      - name: Summarize
        if: always()
        shell: bash
        run: uv run --no-sync python scripts/qualification/summarize.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-identity
          path: qualification-results/
          retention-days: 30

  runtime:
    name: Runtime (proxy and gateway)
    if: ${{ (github.event_name == 'pull_request') || inputs.lanes == 'all' || contains(format(',{0},', inputs.lanes), ',runtime,') || (github.event_name == 'push' && (!contains(github.event.head_commit.message, 'lanes=') || contains(github.event.head_commit.message, 'runtime'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install from source
        shell: bash
        run: uv sync --frozen --no-dev --extra api
      - name: Run the runtime lane
        shell: bash
        run: uv run --no-sync python scripts/qualification/runtime.py
      - name: Summarize
        if: always()
        shell: bash
        run: uv run --no-sync python scripts/qualification/summarize.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-runtime
          path: qualification-results/
          retention-days: 30

  deploy:
    name: Deploy (${{ matrix.variant }})
    if: ${{ (github.event_name == 'pull_request') || inputs.lanes == 'all' || contains(format(',{0},', inputs.lanes), ',deploy,') || (github.event_name == 'push' && (!contains(github.event.head_commit.message, 'lanes=') || contains(github.event.head_commit.message, 'deploy'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [compose, helm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Run the deploy lane
        shell: bash
        env:
          DEPLOY_VARIANT: ${{ matrix.variant }}
        run: uv run --no-project python scripts/qualification/deploy.py --variant "$DEPLOY_VARIANT"
      - name: Summarize
        if: always()
        shell: bash
        run: uv run --no-project python scripts/qualification/summarize.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-deploy-${{ matrix.variant }}
          path: qualification-results/
          retention-days: 30

  report:
    name: Report and regression budget
    needs: [accuracy, performance, performance-postgres, platforms, action, identity, runtime, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded-results
          pattern: qualification-*
      - name: Combined summary
        shell: bash
        run: uv run --no-project python scripts/qualification/summarize.py --results downloaded-results
      - name: Compare against the committed baseline
        shell: bash
        run: uv run --no-project python scripts/qualification/baseline.py --results downloaded-results
