name: Perf Scale Evidence

# Regenerates the lightweight in-process scale evidence on a weekly cadence
# so docs/perf/results/ stays current as the graph builder evolves. The
# 1k-estate run takes <1 minute on github-hosted runners and is the floor
# evidence referenced from docs/perf/ingest-throughput.md and
# docs/DEPLOY_PLATFORM.md. Graph API/Postgres benchmark scaffolds are
# dry-run validated here. The opt-in mixed_graph input also measures bounded
# graph HTTP requests during ingestion; it is not a production capacity claim.

on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC
    - cron: "30 3 * * *"  # nightly push-ingest-with-readers budgets
  workflow_dispatch:
    inputs:
      trace_collection:
        description: "Qualify three synthetic trace collection runs within 2 CPUs and 2 GiB"
        type: boolean
        default: false
      mixed_graph:
        description: "Also measure graph HTTP reads during ingestion on a million-node synthetic fixture"
        type: boolean
        default: false
      mixed_graph_seconds:
        description: "Mixed-load duration (0 uses fixed counts; maximum 600 seconds)"
        type: string
        default: "0"
      push_ingest:
        description: "Measure 10x/50x report-push ingest with concurrent readers"
        type: boolean
        default: false
      workflow_budget:
        description: "Measure the end-to-end workflow resource profile (scripts/run_workflow_resource_benchmark.py)"
        type: boolean
        default: false
      open_pr:
        description: "Open a PR if the regenerated JSON differs from the checked-in baseline"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: perf-scale-evidence
  cancel-in-progress: false

jobs:
  regenerate-scale-evidence:
    if: (github.event_name != 'workflow_dispatch' || inputs.trace_collection != true || inputs.open_pr == true) && github.event.schedule != '30 3 * * *'
    name: Regenerate scale evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - name: Install agent-bom (from source)
        run: uv sync --extra dev

      - name: Regenerate in-process scale evidence
        id: regen
        run: |
          set -euo pipefail
          OUTPUT="docs/perf/results/scale-evidence-local-$(date -u +%Y-%m-%d).json"
          uv run python scripts/run_scale_evidence.py --output "$OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUTPUT"

      - name: Validate evidence against schema
        run: uv run python scripts/check_scale_evidence.py

      - name: Validate graph API/Postgres benchmark scaffold
        run: |
          set -euo pipefail
          uv run python scripts/generate_graph_benchmark_estate.py \
            --agents 25 \
            --report-output /tmp/graph-benchmark-estate-report.json \
            --summary-output /tmp/graph-benchmark-estate-summary.json
          uv run python scripts/run_graph_api_benchmark.py \
            --dry-run \
            --output /tmp/graph-api-benchmark.json
          uv run python scripts/run_graph_postgres_explain.py \
            --dry-run \
            --output-dir /tmp/postgres-graph-explain \
            --summary-output /tmp/postgres-graph-explain.json
          uv run pytest tests/test_graph_benchmark_scaffold.py -q

      - name: Run measured graph scale assertion
        run: uv run pytest tests/graph/test_store_backed_build_wiring.py -q -m graph_performance

      - name: Upload result artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scale-evidence-${{ github.run_id }}
          path: ${{ steps.regen.outputs.output }}
          retention-days: 90

      - name: Open PR if regenerated evidence differs (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.open_pr == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/perf/results/; then
            echo "No diff in docs/perf/results/; nothing to PR."
            exit 0
          fi
          BRANCH="auto/perf-scale-evidence-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/perf/results/
          git commit -m "perf: refresh scheduled scale evidence ($(date -u +%Y-%m-%d))"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "perf: refresh scheduled scale evidence" \
            --body "Automated refresh of \`docs/perf/results/\` from the weekly scale-evidence run. See #1806."

  trace-collection:
    if: github.event_name == 'workflow_dispatch' && inputs.trace_collection == true
    permissions:
      contents: read
    name: Qualify bounded synthetic trace collection
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
      - name: Install locked harness environment
        run: uv sync --frozen --extra api --extra dev
      - name: Verify qualification contracts
        run: uv run pytest -q tests/test_trace_collection_qualification.py
      - name: Measure all three bounded runs
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/trace-collection-evidence"
          mkdir -p "$evidence"
          {
            git rev-parse HEAD
            uname -a
            lscpu
            free -m
            systemd --version
            echo 'Per-run cgroup limits: CPUQuota=200%; MemoryMax=2G; API worker threads=2'
          } > "$evidence/resources.txt"
          status=0
          for attempt in 1 2 3; do
            # A fresh scope includes every child process; return to the runner
            # user so Git provenance and output ownership retain normal semantics.
            # Keep log redirection outside sudo, owned by the runner.
            # shellcheck disable=SC2024
            if sudo systemd-run --quiet --scope -p CPUQuota=200% -p MemoryMax=2G \
              sudo -u "$(id -un)" env \
              AGENT_BOM_WORKER_THREAD_LIMIT=2 \
              AGENT_BOM_EXPERIMENTAL=traces \
              AGENT_BOM_STATE_DIR="$RUNNER_TEMP/trace-state-$attempt" \
              AGENT_BOM_AUDIT_HMAC_KEY="$(openssl rand -hex 32)" \
              "$GITHUB_WORKSPACE/.venv/bin/python" -m scripts.run_trace_collection_qualification \
              --output "$evidence/run-$attempt" --backend sqlite \
              --workers 3 --pages 10 --rows 100 \
              --p95-limit-ms 5000 --slowdown-limit 4 \
              > "$evidence/run-$attempt.log" 2>&1; then
              echo "Run $attempt passed"
            else
              echo "Run $attempt failed; preserving evidence and completing the remaining runs"
              status=1
            fi
          done
          exit "$status"
      - name: Preserve successful and failed measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trace-collection-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/trace-collection-evidence/*/receipt.json
            ${{ runner.temp }}/trace-collection-evidence/*/attempts.jsonl
            ${{ runner.temp }}/trace-collection-evidence/*.log
            ${{ runner.temp }}/trace-collection-evidence/resources.txt
          if-no-files-found: warn
          retention-days: 30

  mixed-graph:
    if: github.event_name == 'workflow_dispatch' && inputs.mixed_graph == true
    permissions:
      contents: read
    name: Measure synthetic graph reads during ingestion
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
      - name: Install locked harness environment
        run: uv sync --frozen --extra api --extra dev
      - name: Verify evidence contracts
        run: uv run pytest -q tests/test_graph_mixed_scale_evidence.py
      - name: Run four-tenant million-node fixture
        env:
          MIXED_GRAPH_SECONDS: ${{ inputs.mixed_graph_seconds }}
        run: >-
          uv run python scripts/run_graph_mixed_scale_evidence.py
          --output "$RUNNER_TEMP/graph-mixed-evidence"
          --duration-seconds "$MIXED_GRAPH_SECONDS"
      - name: Preserve successful and failed measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-mixed-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/graph-mixed-evidence/receipt.json
            ${{ runner.temp }}/graph-mixed-evidence/server.log
          if-no-files-found: warn
          retention-days: 30

  push-ingest-readers:
    # Nightly, not on PRs: the 50x estate takes minutes. PR CI carries the 1x
    # budget (tests/test_push_ingest_perf_budget.py).
    if: github.event.schedule == '30 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.push_ingest == true)
    name: Push ingest with readers (${{ matrix.agents }} agents)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        agents: [500, 2500]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - name: Install agent-bom (from source)
        run: uv sync --frozen --extra api --extra dev

      - name: Push the estate with a timed-out retry and concurrent readers
        shell: bash
        run: |
          uv run python scripts/run_push_ingest_benchmark.py --agents "${{ matrix.agents }}" --mode async --readers 4 \
            | tee "push-ingest-${{ matrix.agents }}.json"

      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: push-ingest-${{ matrix.agents }}
          path: push-ingest-${{ matrix.agents }}.json
          if-no-files-found: ignore

  workflow-resource-budget:
    # Nightly, not on PRs: cold, warm, restart and SIGKILL-cancellation phases of
    # the small-self-hosted profile take minutes. PR CI carries the ci-budget
    # profile (tests/test_workflow_resource_budget.py).
    if: github.event.schedule == '30 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.workflow_budget == true)
    name: Workflow resource profile (small-self-hosted, SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - name: Install agent-bom (from source)
        run: uv sync --frozen --extra api --extra dev

      - name: Measure collect, scan, ingest, store, query, export, retain, rebuild, restart and cancel
        run: uv run python scripts/run_workflow_resource_benchmark.py --profile small-self-hosted --output workflow-resource-budget.json

      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-resource-budget
          path: workflow-resource-budget.json
          if-no-files-found: ignore
