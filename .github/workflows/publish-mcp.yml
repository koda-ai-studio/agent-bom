name: Publish MCP Container

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions: {}  # all permissions denied by default; jobs declare only what they need

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  release:
    name: Resolve published source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      publish_current: ${{ steps.release.outputs.publish_current }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      published_at: ${{ steps.release.outputs.published_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve_published_mcp_release.py

  publish-stdio:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write       # required for SLSA provenance attestation
      attestations: write   # required for SBOM + provenance attestations
    if: ${{ needs.release.outputs.publish_current == 'true' }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP container (stdio)
        id: build-stdio
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # BuildKit fetches the verified release directly; no release checkout
          # or release scripts run on the publishing runner.
          context: https://github.com/${{ github.repository }}.git#${{ needs.release.outputs.release_sha }}
          file: deploy/docker/Dockerfile.mcp
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-bom-mcp:${{ needs.release.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/agent-bom-mcp:latest
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=agent-bom-mcp
            org.opencontainers.image.description=Open security scanner for AI supply chain and infrastructure — agents, MCP, packages, containers, cloud, GPU, and runtime. MCP server (stdio).
            org.opencontainers.image.created=${{ needs.release.outputs.published_at }}
            org.opencontainers.image.revision=${{ needs.release.outputs.release_sha }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/agent-bom-mcp
          subject-digest: ${{ steps.build-stdio.outputs.digest }}
          push-to-registry: true

  publish-sse:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write       # required for SLSA provenance attestation
      attestations: write   # required for SBOM + provenance attestations
    if: ${{ needs.release.outputs.publish_current == 'true' }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP container (SSE)
        id: build-sse
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Keep the HTTP image on the same verified Git context as stdio.
          context: https://github.com/${{ github.repository }}.git#${{ needs.release.outputs.release_sha }}
          file: deploy/docker/Dockerfile.sse
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-bom-sse:${{ needs.release.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/agent-bom-sse:latest
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=agent-bom-sse
            org.opencontainers.image.description=Open security scanner for AI supply chain and infrastructure — agents, MCP, packages, containers, cloud, GPU, and runtime. MCP server (streamable HTTP).
            org.opencontainers.image.created=${{ needs.release.outputs.published_at }}
            org.opencontainers.image.revision=${{ needs.release.outputs.release_sha }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/agent-bom-sse
          subject-digest: ${{ steps.build-sse.outputs.digest }}
          push-to-registry: true
