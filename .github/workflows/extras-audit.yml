name: Extras Dependency Audit

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/extras-audit.yml
      - scripts/classify_ci_changes.py
      - tests/test_ci_path_classifier.py
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Extras dependency classifier
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python_dependencies: ${{ steps.classify.outputs.python_dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare committed dependency inputs
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          git diff --name-only "$base" "${{ github.event.pull_request.head.sha }}" |
            python3 scripts/classify_ci_changes.py --base-ref "$base" --head-ref "${{ github.event.pull_request.head.sha }}" --github-output "$GITHUB_OUTPUT"

  audit-extras:
    name: Audit extras (${{ matrix.name }})
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.python_dependencies != 'false'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-runtime
            extras: "api oidc runtime"
          - name: mcp-surface
            extras: "mcp-server graph"
          - name: analytics
            extras: "postgres lake"
          - name: cloud-surface
            extras: "cloud"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - name: Install selected extras
        run: |
          args=()
          for extra in ${{ matrix.extras }}; do
            args+=(--extra "$extra")
          done
          uv sync --frozen "${args[@]}"

      - name: Capture resolved dependency tree
        run: |
          mkdir -p audit
          uv tree > "audit/${{ matrix.name }}-tree.txt"

      - name: Audit selected extras with pip-audit
        run: |
          mkdir -p audit
          # Ignore no-fix advisories from the temporary pip-audit tool environment
          # and resolved auth libraries until upstream publishes a patched release.
          uv run --with pip-audit pip-audit \
            --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-112940 --ignore-vuln GHSA-v4x8-3wr5-3wq8 --ignore-vuln CVE-2026-112913 --ignore-vuln GHSA-9vhv-jxww-xfm5 --ignore-vuln CVE-2026-112907 --ignore-vuln GHSA-567q-5qvw-pf92 \
            --ignore-vuln PYSEC-2025-183 \
            --format json \
            --output "audit/${{ matrix.name }}-pip-audit.json"

      - name: Upload extras audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extras-audit-${{ matrix.name }}
          path: audit/
