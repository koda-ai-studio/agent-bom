name: Publish to Registries

# Publishes after a successful Release workflow and reconciles every
# idempotent registry every six hours until the public surfaces match the
# latest release contract. Scheduled ClawHub retries also recover a release
# event displaced from GitHub's single pending concurrency slot.
# Smithery publishing retired after its API, accounts, proxy, and CLI shut down
# on 2026-10-31: https://www.smithery.ai/future . Do not send credentials or
# create releases against the retired service. The direct MCP origin remains
# authenticated and is verified by Deployment Freshness.
# Secrets needed (add via Settings -> Secrets): CLAWHUB_TOKEN, GLAMA_API_KEY.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-registries
  cancel-in-progress: false

jobs:
  release:
    name: Resolve published release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_ref: ${{ steps.release.outputs.release_ref }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      tool_count: ${{ steps.release.outputs.tool_count }}
      published_at: ${{ steps.release.outputs.published_at }}
      publish_current: ${{ steps.release.outputs.publish_current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "workflow_run" ]; then
            # Manual and scheduled reconciliation always target the latest
            # published release. Accepting an older tag here could downgrade a
            # registry as a side effect.
            RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")
            RELEASE_TAG=$(echo "$RELEASE_JSON" | jq -er '.tag_name')
            if [ "$(echo "$RELEASE_JSON" | jq -r '.draft != false')" = "true" ]; then
              echo "::error::Registry repair requires a published, non-draft GitHub release"
              exit 1
            fi
          else
            if [ "$RUN_EVENT" != "push" ] || [ "$RUN_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::Release workflow must be a same-repository tag push"
              exit 1
            fi
            RELEASE_TAG="${HEAD_BRANCH:-}"
            if ! echo "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
              echo "::error::Successful Release workflow did not report a release tag"
              exit 1
            fi
            if [ -z "${HEAD_SHA:-}" ]; then
              echo "::error::Successful Release workflow did not report a release commit"
              exit 1
            fi
            LATEST_RELEASE_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
            if [ "$LATEST_RELEASE_TAG" != "$RELEASE_TAG" ]; then
              echo "publish_current=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping delayed ${RELEASE_TAG} registry event because ${LATEST_RELEASE_TAG} is already the latest published release"
              exit 0
            fi
          fi

          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          RELEASE_SHA=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$RELEASE_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Release tag and successful workflow commit do not match"
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Published release commit is not reachable from the trusted default branch"
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Resolved release tag is not semantic versioned"
            exit 1
          fi
          METRICS_JSON=$(git show "${RELEASE_SHA}:docs/PRODUCT_METRICS.json")
          METRICS_VERSION=$(echo "$METRICS_JSON" | jq -er '.version')
          TOOL_COUNT=$(echo "$METRICS_JSON" | jq -er '(first(.metrics[] | select(.name == "MCP default tools") | .value) // first(.metrics[] | select(.name == "MCP tools") | .value))')
          if [ "$METRICS_VERSION" != "$VERSION" ]; then
            echo "::error::Published release metrics version ${METRICS_VERSION} does not match ${VERSION}"
            exit 1
          fi
          if ! echo "$TOOL_COUNT" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::Published release metrics do not declare a positive MCP tool count"
            exit 1
          fi
          PUBLISHED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.published_at // empty')
          if ! echo "$PUBLISHED_AT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'; then
            echo "::error::Published release has no valid publish time"
            exit 1
          fi
          {
            echo "published_at=$PUBLISHED_AT"
            echo "publish_current=true"
            echo "version=$VERSION"
            echo "release_ref=refs/tags/${RELEASE_TAG}"
            echo "release_sha=$RELEASE_SHA"
            echo "tool_count=$TOOL_COUNT"
          } >> "$GITHUB_OUTPUT"

  glama:
    name: Verify Glama Directory
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: ${{ needs.release.outputs.publish_current == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch release commit for manifest verification
        env:
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
        run: git fetch --no-tags --depth=1 origin "$RELEASE_SHA"

      - name: Verify Glama build manifest
        run: python scripts/check_glama_listing.py --verify-manifest --git-ref "${{ needs.release.outputs.release_sha }}"

      - name: Extract immutable release tool contract
        run: >-
          python scripts/check_glama_listing.py
          --write-tool-names /tmp/glama-expected-tool-names.json
          --git-ref "${{ needs.release.outputs.release_sha }}"

      - name: Export published release schemas for Glama
        env:
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        run: |
          python scripts/export_release_mcp_contract.py \
            --expected "$EXPECTED_VERSION" \
            --expected-tool-names-file /tmp/glama-expected-tool-names.json \
            --out /tmp/glama-expected-tool-contract.json

      - name: Verify Glama listing freshness
        env:
          GLAMA_API_KEY: ${{ secrets.GLAMA_API_KEY }}
          GLAMA_LISTING_URL: ${{ vars.GLAMA_LISTING_URL }}
          GLAMA_API_URL: ${{ vars.GLAMA_API_URL }}
          GLAMA_SCHEMA_URL: ${{ vars.GLAMA_SCHEMA_URL }}
          GLAMA_DIAGNOSTICS_DIR: ${{ runner.temp }}/glama-response
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_TOOL_COUNT: ${{ needs.release.outputs.tool_count }}
          RELEASE_PUBLISHED_AT: ${{ needs.release.outputs.published_at }}
          # Glama rebuilds from the linked repository on its own schedule. A
          # stale or unreachable listing inside this window after the release is
          # provider sync lag (warning); after it, a real failure that pages.
          GLAMA_SYNC_GRACE_HOURS: "72"
        run: |
          set -euo pipefail
          STATUS=0
          python scripts/check_glama_listing.py \
            --expected "$EXPECTED_VERSION" \
            --expected-tool-count "$EXPECTED_TOOL_COUNT" \
            --expected-tool-names-file /tmp/glama-expected-tool-names.json \
            --expected-tool-contract-file /tmp/glama-expected-tool-contract.json \
            --release-published-at "$RELEASE_PUBLISHED_AT" \
            --provider-sync-grace-hours "$GLAMA_SYNC_GRACE_HOURS" \
            --retries 6 \
            --delay-seconds 30 || STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          if [ "$STATUS" -eq 3 ]; then
            echo "::warning::Glama has not synchronized v${EXPECTED_VERSION} yet (provider-side, within the ${GLAMA_SYNC_GRACE_HOURS}h grace after release). This workflow retries every six hours. For an immediate refresh, use Sync Server in the Glama admin interface."
            exit 0
          fi
          echo "::error::Glama has not synchronized the exact released catalog ${GLAMA_SYNC_GRACE_HOURS}h after release. Glama syncs linked GitHub repositories automatically at least daily, so this is no longer routine lag: use Sync Server in the Glama admin interface, check the Glama build log for integrations/glama/Dockerfile, then rerun this verification."
          exit 1

      - name: Retain failed public Glama responses
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glama-failure-evidence
          path: ${{ runner.temp }}/glama-response/
          retention-days: 7
          if-no-files-found: ignore

  clawhub:
    name: Publish to ClawHub
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: ${{ needs.release.outputs.publish_current == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep privileged workflow code on the trusted default branch. Exact
          # release assets are exported as inert regular files below; the
          # workflow never checks out or executes the release tree.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Check ClawHub configuration
        id: clawhub_config
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "${CLAWHUB_TOKEN:-}" ]; then
            echo "::notice::CLAWHUB_TOKEN not configured — skipping ClawHub publish"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Stage exact release ClawHub assets
        if: steps.clawhub_config.outputs.enabled == 'true'
        env:
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
          CLAWHUB_RELEASE_ROOT: ${{ runner.temp }}/clawhub-release
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$RELEASE_SHA"

          # A privileged workflow must not check out or execute a data-derived
          # release tree. Export only the curated OpenClaw subtree, and reject
          # symlinks, submodules, and executable files before extraction.
          INVALID_ENTRIES=$(git ls-tree -r "$RELEASE_SHA" -- integrations/openclaw |
            awk '$1 != "100644" { print }')
          if [ -n "$INVALID_ENTRIES" ]; then
            echo "::error::Only regular, non-executable release assets may be published to ClawHub"
            printf '%s\n' "$INVALID_ENTRIES"
            exit 1
          fi

          mkdir -p "$CLAWHUB_RELEASE_ROOT"
          git archive --format=tar "$RELEASE_SHA" -- integrations/openclaw |
            tar -xf - --directory "$CLAWHUB_RELEASE_ROOT" --no-same-owner --no-same-permissions
          if find "$CLAWHUB_RELEASE_ROOT" -type l -print -quit | grep -q .; then
            echo "::error::ClawHub release staging produced a symbolic link"
            exit 1
          fi

      - name: Install ClawHub CLI
        if: steps.clawhub_config.outputs.enabled == 'true'
        run: |
          npm install -g clawhub@latest
          # `clawhub --version` is not a supported option on the current CLI, so
          # use --help as a binary-present probe instead. `npm install -g` already
          # exits non-zero on install failure; this just confirms the command is
          # on PATH before the publish step runs.
          clawhub --help > /dev/null

      - name: Publish to ClawHub
        shell: bash
        if: steps.clawhub_config.outputs.enabled == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          CLAWHUB_RELEASE_ROOT: ${{ runner.temp }}/clawhub-release
        run: |
          echo "Publishing agent-bom v${VERSION} to ClawHub..."
          clawhub login --token "$CLAWHUB_TOKEN" --no-browser

          _publish_skill() {
            local DIR="$1" SLUG="$2" FATAL="${3:-true}"
            local DISPLAY_NAME="${4:-$SLUG}"

            if [ ! -d "$DIR" ]; then
              echo "::warning::No files found in ${DIR} — skipping"
              return 0
            fi

            # Idempotency: if the exact same version already exists on ClawHub,
            # treat it as success rather than churning the retry loop. Run the
            # publish once and capture output so we can detect the 'already
            # exists' signal in the retry-or-exit branch below.
            local TMP_OUT
            TMP_OUT=$(mktemp)
            for ATTEMPT in 1 2 3; do
              echo "ClawHub ${SLUG} attempt ${ATTEMPT}/3..."
              if clawhub publish "$DIR" \
                --slug "$SLUG" \
                --name "$DISPLAY_NAME" \
                --version "$VERSION" \
                --changelog "Release v${VERSION}" \
                --tags latest 2>&1 | tee "$TMP_OUT"; then
                echo "ClawHub ${SLUG} v${VERSION} published"
                rm -f "$TMP_OUT"
                return 0
              fi
              # Idempotent path: ClawHub reports 'already exists' / 'version
              # already published' / HTTP 409 when the same version is re-pushed.
              # That's success for a re-run of the same release — close #1547.
              if grep -qiE 'already (exists|published)|version.*conflict|http 409|status.*409' "$TMP_OUT"; then
                echo "::notice::ClawHub ${SLUG} v${VERSION} already published — treating as success (idempotent)"
                rm -f "$TMP_OUT"
                return 0
              fi
              echo "ClawHub ${SLUG} publish failed"
              if [ "$ATTEMPT" -lt 3 ]; then
                sleep $((ATTEMPT * 10))
              fi
            done
            rm -f "$TMP_OUT"
            if [ "$FATAL" = "true" ]; then
              echo "::error::ClawHub ${SLUG} publish failed after 3 attempts"
              return 1
            else
              echo "::warning::ClawHub ${SLUG} publish failed — non-fatal"
              return 0
            fi
          }

          # Curated, focused skills only. Do not publish the oversized omnibus root
          # skill to ClawHub — keep the marketplace surface small and guardrailed.
          _publish_skill "${CLAWHUB_RELEASE_ROOT}/integrations/openclaw/scan"       "agent-bom-scan"       true  "agent-bom scan"
          _publish_skill "${CLAWHUB_RELEASE_ROOT}/integrations/openclaw/compliance" "agent-bom-compliance" false "agent-bom compliance"
          _publish_skill "${CLAWHUB_RELEASE_ROOT}/integrations/openclaw/registry"   "agent-bom-registry"   false "agent-bom registry"
          _publish_skill "${CLAWHUB_RELEASE_ROOT}/integrations/openclaw/runtime"    "agent-bom-runtime"    false "agent-bom runtime"
          _publish_skill "${CLAWHUB_RELEASE_ROOT}/integrations/openclaw/discover-aws" "agent-bom-discover-aws" false "agent-bom discover aws"
          _publish_skill "${CLAWHUB_RELEASE_ROOT}/integrations/openclaw/discover-azure" "agent-bom-discover-azure" false "agent-bom discover azure"
          _publish_skill "${CLAWHUB_RELEASE_ROOT}/integrations/openclaw/discover-gcp" "agent-bom-discover-gcp" false "agent-bom discover gcp"
          _publish_skill "${CLAWHUB_RELEASE_ROOT}/integrations/openclaw/discover-snowflake" "agent-bom-discover-snowflake" false "agent-bom discover snowflake"
          _publish_skill "${CLAWHUB_RELEASE_ROOT}/integrations/openclaw/ingest" "agent-bom-ingest" false "agent-bom ingest"
          _publish_skill "${CLAWHUB_RELEASE_ROOT}/integrations/openclaw/vulnerability-intel" "agent-bom-vulnerability-intel" false "agent-bom vulnerability intel"
