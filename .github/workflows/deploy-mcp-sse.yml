name: Deploy MCP SSE

# Deploys the SSE container to Railway from the trusted release tag checkout.
# Requires RAILWAY_TOKEN secret and DEPLOY_TARGET=railway variable.
# Optional: RAILWAY_SERVICE variable to specify the service name.
#
# Post-deploy: verifies the deployed version matches the release tag.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: >-
      ${{
        vars.DEPLOY_TARGET == 'railway'
      }}
    steps:
      - name: Resolve trusted release tag
        shell: bash
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          REF="$REF_NAME"
          # Only release tags are deployable. Branches and partial semver refs
          # are rejected before any repository code is checked out.
          if ! echo "$REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing to deploy non-semver ref: $REF"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "Deploying trusted release tag: $REF"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout matches trusted release tag
        env:
          EXPECTED_TAG: ${{ steps.tag.outputs.ref }}
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin "refs/tags/$EXPECTED_TAG:refs/tags/$EXPECTED_TAG"
          TAG_SHA=$(git rev-list -n 1 "$EXPECTED_TAG^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Checked-out commit $HEAD_SHA does not match $EXPECTED_TAG commit $TAG_SHA"
            exit 1
          fi
          REPO_VERSION=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('pyproject.toml').read_text()
          m = re.search(r'version\s*=\s*\"([^\"]+)\"', text)
          print(m.group(1))
          ")
          if [ "$REPO_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Checked-out version $REPO_VERSION does not match release tag $EXPECTED_TAG"
            exit 1
          fi
          METRICS_JSON=$(git show "HEAD:docs/PRODUCT_METRICS.json")
          METRICS_VERSION=$(echo "$METRICS_JSON" | jq -er '.version')
          TOOL_COUNT=$(echo "$METRICS_JSON" | jq -er '(first(.metrics[] | select(.name == "MCP default tools") | .value) // first(.metrics[] | select(.name == "MCP tools") | .value))')
          if [ "$METRICS_VERSION" != "$REPO_VERSION" ]; then
            echo "::error::Release metrics version $METRICS_VERSION does not match $REPO_VERSION"
            exit 1
          fi
          if ! echo "$TOOL_COUNT" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::Release metrics do not declare a positive MCP tool count"
            exit 1
          fi
          echo "Checked-out version: $REPO_VERSION"
          echo "repo_version=$REPO_VERSION" >> "$GITHUB_ENV"
          echo "repo_tool_count=$TOOL_COUNT" >> "$GITHUB_ENV"

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.30.5  # pinned — update periodically

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN not set — cannot deploy to Railway. Set the secret or disable DEPLOY_TARGET."
            exit 1
          fi
          if [ -n "$RAILWAY_SERVICE" ]; then
            railway up --service "$RAILWAY_SERVICE" --detach
          else
            railway up --detach
          fi

      # The Railway deploy above has already succeeded when this runs. The probe
      # verifies the deployed release contract; its outcome is classified so an
      # identity-provider outage reads as "deploy succeeded, probe deferred"
      # instead of a failed deploy.
      - name: Post-deploy exact release contract check
        id: probe
        shell: bash
        env:
          RAILWAY_MCP_URL: ${{ vars.RAILWAY_MCP_URL }}
          RAILWAY_MCP_BEARER_TOKEN: ${{ secrets.RAILWAY_MCP_BEARER_TOKEN }}
          MCP_PROBE_OAUTH_ISSUER: ${{ vars.MCP_PROBE_OAUTH_ISSUER }}
          MCP_PROBE_OAUTH_TOKEN_URL: ${{ vars.MCP_PROBE_OAUTH_TOKEN_URL }}
          MCP_PROBE_OAUTH_AUDIENCE: ${{ vars.MCP_PROBE_OAUTH_AUDIENCE }}
          MCP_PROBE_OAUTH_CLIENT_ID: ${{ vars.MCP_PROBE_OAUTH_CLIENT_ID }}
          MCP_PROBE_OAUTH_CLIENT_SECRET: ${{ secrets.MCP_PROBE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          echo "Waiting 60s for Railway to rebuild and start..."
          sleep 60
          DEPLOY_URL="${RAILWAY_MCP_URL:-https://agent-bom-mcp.up.railway.app}"
          echo "Checking the public server card at $DEPLOY_URL"
          set +e
          PYTHONPATH=src python3 scripts/deploy/probe_with_oauth.py -- \
            --base-url "$DEPLOY_URL" \
            --server-card --require-mcp-auth \
            --expected-version "$repo_version" \
            --expected-tool-count "$repo_tool_count" \
            --attempts 5 \
            --backoff-seconds 30 \
            --timeout 15 >/dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "outcome=verified" >> "$GITHUB_OUTPUT"
            echo "Exact release contract confirmed: v${repo_version}, ${repo_tool_count} MCP tool schemas"
          fi
          # probe_with_oauth.py wrote probe_outcome / probe_detail to GITHUB_OUTPUT.
          exit 0

      - name: Classify a failed post-deploy probe (deploy already succeeded)
        if: steps.probe.outputs.outcome != 'verified'
        shell: bash
        env:
          OUTCOME: ${{ steps.probe.outputs.probe_outcome }}
          DETAIL: ${{ steps.probe.outputs.probe_detail }}
          VERSION: ${{ env.repo_version }}
        run: |
          set -euo pipefail
          OUTCOME="${OUTCOME:-probe_failed}"
          DETAIL="${DETAIL:-no detail recorded}"
          if [ "$OUTCOME" = "auth_provider_unavailable" ]; then
            echo "::warning title=Deploy succeeded, post-deploy probe deferred::Railway deploy of v${VERSION} succeeded; the probe could not obtain a token because the OAuth provider was unavailable (${DETAIL}). Re-run the Deployment freshness workflow once the identity provider is back."
            {
              echo "## Deploy succeeded, post-deploy probe deferred"
              echo
              echo "Railway deploy of v${VERSION} succeeded. The authenticated contract check was not run: ${DETAIL}."
              echo "Re-run the **Deployment freshness** workflow once the identity provider is reachable."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error title=Deploy succeeded, release contract NOT verified::Railway deploy of v${VERSION} succeeded but the post-deploy probe failed (${OUTCOME}: ${DETAIL}). The deployed version and tool count are unverified."
          {
            echo "## Deploy succeeded, release contract NOT verified"
            echo
            echo "Railway deploy of v${VERSION} succeeded. The post-deploy probe failed: ${OUTCOME}: ${DETAIL}."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
