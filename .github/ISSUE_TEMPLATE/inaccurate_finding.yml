name: Inaccurate Finding
description: Report a false positive, false negative, misleading remediation, or an unsupported graph relationship.
labels: ["bug", "area/scanning"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for public accuracy reports only. Do not include secrets, private source code, private package names, or customer data. Report vulnerabilities in agent-bom privately through SECURITY.md. Synthetic reproductions are welcome; identify them as synthetic.

  - type: input
    id: version
    attributes:
      label: agent-bom version
      description: Run `agent-bom --version`.
      placeholder: "Installed version; source commit SHA if running from a checkout"
    validations:
      required: true

  - type: dropdown
    id: finding-type
    attributes:
      label: Finding type
      options:
        - False positive
        - False negative
        - Wrong severity or advisory mapping
        - Misleading remediation
        - Incorrect identity correlation or graph relationship
        - Unsupported reachability or blast-radius claim
        - Missing blast-radius or context
        - Other accuracy issue
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and sanitized output
      description: Include the exact command and the smallest redacted output that shows the issue.
      render: shell
      placeholder: |
        agent-bom scan . -f json -o report.json
        # paste the relevant sanitized finding here
        # example: https://github.com/koda-ai-studio/agent-bom/blob/main/docs/INACCURATE_FINDING_REPORT.md
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should agent-bom have reported instead?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link to public advisory, package metadata, lockfile snippet, SBOM excerpt, or scanner output that supports the correction. See docs/INACCURATE_FINDING_REPORT.md for a safe public example.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, install method, and whether the scan used `--offline`, `--enrich`, an SBOM, or a registry.

  - type: textarea
    id: graph-evidence
    attributes:
      label: Graph relationship evidence (if applicable)
      description: >-
        Include sanitized source and target identities, relationship direction,
        tenant/account/environment scope, snapshot IDs, provenance/source reference,
        evidence type, freshness, and any incomplete collection or paging.
        Explain which independent source supports or contradicts the relationship.
        Keep placeholders consistent across before/after snippets; do not paste a full graph.
      placeholder: |
        source: agent:example-a -> target: tool:example-b
        relationship: uses; scope: synthetic-account-a; snapshot: example-before
        evidence: configured, from a synthetic MCP config; observation time: unknown
        expected: no join to the same-named tool in synthetic-account-b
        collection: partial; absence is not evidence of removal
